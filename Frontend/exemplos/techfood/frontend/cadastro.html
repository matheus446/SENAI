<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />

    <title>Cadastrar Prato - TechFood</title>
  </head>

  <body>
    <header id="topo-loja">
      <h1 id="titulo-site">Cadastrar Novo Prato</h1>

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="cadastro-container">
        <h2 class="titulo-secao">Novo Produto</h2>

        <form id="form-cadastro">
          <input
            type="text"
            id="nome"
            placeholder="Nome do prato"
            required
          />

          <textarea
            id="descricao"
            placeholder="Descrição"
            required
          ></textarea>

          <input
            type="number"
            id="preco"
            placeholder="Preço"
            step="0.01"
            required
          />

          <input
            type="text"
            id="categoria"
            placeholder="Categoria"
          />

          <input
            type="file"
            id="imagem"
            accept="image/*"
            required
          />

          <button type="submit">Cadastrar Produto</button>
        </form>

        <p id="mensagem"></p>
      </section>
    </main>

    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/cadastro.js"></script>
  </body>
</html>
